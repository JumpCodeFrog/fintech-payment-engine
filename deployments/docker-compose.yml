services:
  # 1. PostgreSQL 16 (Ledger, Accounts & Outbox)
  postgres:
    image: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: fintech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintech_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/000001_init_schema.sql:ro
      - ../migrations/000002_seed_data.up.sql:/docker-entrypoint-initdb.d/000002_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintech_db"]
      interval: 5s
      timeout: 5s
      retries: 5


  # 2. Redpanda (Kafka-compatible broker)
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2@sha256:da0e105339d4f0ae6b493f1e027843ea6dea199183a444235555efc2b816f941
    container_name: fintech_kafka
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
    ports:
      - "19092:19092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy -X brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka_init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2@sha256:da0e105339d4f0ae6b493f1e027843ea6dea199183a444235555efc2b816f941
    container_name: fintech_kafka_init
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-payment-events}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        rpk topic create "$$KAFKA_TOPIC" --partitions 3 --replicas 1 -X brokers=kafka:9092 >/dev/null 2>&1 || true
        rpk topic describe "$$KAFKA_TOPIC" -X brokers=kafka:9092 >/dev/null
    restart: "no"

  # 3. Redpanda Console (Kafka UI)
  kafka_ui:
    image: docker.redpanda.com/redpandadata/console:v2.5.2@sha256:58dbd75a425b3c60e79a6b6fb46d91d6553594a51751d19e2f47202860cb06e7
    container_name: fintech_kafka_ui
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      kafka_init:
        condition: service_completed_successfully

volumes:
  pg_data:
  redpanda_data:
