version: '3.8'

services:
  # 1. PostgreSQL 16 (Ledger, Accounts & Outbox)
  postgres:
    image: postgres:16-alpine
    container_name: fintech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fintech_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fintech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 (Idempotency Key & Redlock)
  redis:
    image: redis:7-alpine
    container_name: fintech_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redpanda (Lightweight, ultra-fast C++ Kafka-compatible broker)
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: fintech_kafka
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "19092:19092"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # 4. Redpanda Console (Kafka UI)
  kafka_ui:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: fintech_kafka_ui
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - kafka

  # 5. Jaeger (OpenTelemetry Distributed Tracing UI)
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: fintech_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver

  # 6. Prometheus (Metrics Scraper)
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: fintech_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # 7. Grafana (Dashboards)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: fintech_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pg_data:
  redis_data:
  redpanda_data:
